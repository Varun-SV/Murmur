name: murmur
description: "Ambient on-device reminder engine. Listens, transcribes with Whisper, surfaces reminders — no audio ever leaves the device."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_foreground_task: ^8.0.0
  record: ^5.0.0
  shared_preferences: ^2.3.0
  logging: ^1.0.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^9.0.0

flutter:
  uses-material-design: true
